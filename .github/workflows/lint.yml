name: Lint and format

on:
  pull_request:
    types: [opened, edited, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm i

      - name: Lint
        run: npm run lint

      - name: Format
        run: npx prettier --check .

      - name: Check i18n
        run: npm run i18n
