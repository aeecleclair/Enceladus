name: Lint and format

on:
  pull_request:
    types: [opened, edited, ready_for_review, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Nodejs
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: npm i

      - name: Lint
        run: npm run lint

      - name: Format
        run: npx prettier --check .