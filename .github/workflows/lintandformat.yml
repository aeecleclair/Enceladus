name: Lint and format

on:
  pull_request:
    types: [opened, edited, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  lintandformat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm i

      - name: Check Typescript compilation
        run: |
          sed -i 's|http://127.0.0.1:8000|'"$NEXT_PUBLIC_BACKEND_URL"'|g' openapi-ts.config.ts
          npm run generate
          npx tsc
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}

      - name: Lint
        run: npm run lint

      - name: Format
        run: npx prettier --check .

      - name: Check i18n
        run: npm run i18n
